name: Docker Publish

on:
  push:
    branches: ["main"]        # ← cambia "main" si tu rama principal tiene otro nombre
  release:
    types: [published]        # también se dispara cuando creas un release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # → ghcr.io/nicolasgonzlezr/verbanova

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # necesario para subir a GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # ← NO toques esto, GitHub lo inyecta solo

      # ── FRONTEND ─────────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            NEXT_PUBLIC_WS_URL=wss://verbanova.local:13104/ws
            NEXT_PUBLIC_API_BASE_URL=https://verbanova.local:13104
          tags: |
            ghcr.io/nicolasgonzlezr/verbanova-frontend:latest
            ghcr.io/nicolasgonzlezr/verbanova-frontend:${{ github.sha }}
            
      # ── BACKEND ──────────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .          # ← ruta a la carpeta con el Dockerfile del backend
          file: ./Dockerfile.backend        # ← ruta explícita al Dockerfile
          push: true
          tags: |
            ghcr.io/nicolasgonzlezr/verbanova-backend:latest
            ghcr.io/nicolasgonzlezr/verbanova-backend:${{ github.sha }}
