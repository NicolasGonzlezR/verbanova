<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" role="img" aria-label="VerbaNova">
  <defs>
    <!-- Icon gradient: blue → violet top-left to bottom-right -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- "Nova" text gradient: blue → violet left to right (userSpace coords) -->
    <linearGradient id="novaGrad" x1="190" y1="0" x2="295" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Subtle glow filter for the icon -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Icon: rounded square ───────────────────────────────────────────── -->
  <rect x="4" y="4" width="64" height="64" rx="16" fill="url(#iconGrad)"/>

  <!-- ── Waveform: 5 symmetric bars centred in the 64×64 icon ─────────── -->
  <!--   bar width=6, gap=5, span=46, starts at x=4+(64-46)/2=4+9=13      -->
  <!--   heights  18 / 32 / 48 / 32 / 18, centred at y=4+32=36            -->
  <rect x="13" y="27" width="6" height="18" rx="3" fill="white" fill-opacity="0.50"/>
  <rect x="24" y="20" width="6" height="32" rx="3" fill="white" fill-opacity="0.72"/>
  <rect x="35" y="12" width="6" height="48" rx="3" fill="white"/>
  <rect x="46" y="20" width="6" height="32" rx="3" fill="white" fill-opacity="0.72"/>
  <rect x="57" y="27" width="6" height="18" rx="3" fill="white" fill-opacity="0.50"/>

  <!-- ── Wordmark ──────────────────────────────────────────────────────── -->
  <text
    x="84"
    y="50"
    font-family="'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="-0.5"
  >
    <tspan fill="#0f172a">Verba</tspan><tspan fill="url(#novaGrad)">Nova</tspan>
  </text>
</svg>
