---
# ConfigMap con variables de entorno compartidas
apiVersion: v1
kind: ConfigMap
metadata:
  name: verbanota-config
  namespace: verbanota
data:
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "voice-profiles"
  BACKEND_HOST: "backend"
  BACKEND_PORT: "8000"
  FRONTEND_HOST: "frontend"
  FRONTEND_PORT: "3000"

---
# Secret con credenciales MinIO (actualizar con valores reales)
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: verbanota
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"

---
# PersistentVolumeClaim para cache de modelos ML (~5 GB)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-cache-pvc
  namespace: verbanota
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# PersistentVolumeClaim para perfiles de voz (compartido backend+frontend)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-profiles-pvc
  namespace: verbanota
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi

---
# Deployment para Backend (FastAPI WebSocket)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: verbanota
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Tolerations para nodos con GPU si están disponibles
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # Afinidad para preferir nodos con GPU
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: accelerator
                    operator: In
                    values:
                      - nvidia-gpu

      containers:
        - name: backend
          # Reemplazar con tu registry si usas uno privado
          image: translateapp-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            # Variables del ConfigMap
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_ENDPOINT
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_BUCKET

            # Variables del Secret (MinIO)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_SECRET_ACCESS_KEY

            # Variables para modelos ML
            - name: HF_HOME
              value: "/app/.cache"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"

          # Volúmenes montados
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: voice-profiles
              mountPath: /app/uploads

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          # Recursos
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              # GPU si está disponible (opcional)
              # nvidia.com/gpu: 1
            limits:
              memory: "8Gi"
              cpu: "4"
              # nvidia.com/gpu: 1

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: backend-cache-pvc
        - name: voice-profiles
          persistentVolumeClaim:
            claimName: voice-profiles-pvc

---
# Service para Backend
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: verbanota
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
# Deployment para Frontend (Next.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: verbanota
  labels:
    app: frontend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
        - name: frontend
          # Reemplazar con tu registry si usas uno privado
          image: translateapp-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            # Backend URL para las llamadas API
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "http://backend:8000"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://backend:8000"

            # MinIO para subida de archivos (si se usa desde frontend)
            - name: NEXT_PUBLIC_MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_ENDPOINT
            - name: NEXT_PUBLIC_MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_BUCKET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: AWS_SECRET_ACCESS_KEY

          # Volumen compartido para acceso a perfiles de voz
          volumeMounts:
            - name: voice-profiles
              mountPath: /app/uploads

          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          # Recursos
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: voice-profiles
          persistentVolumeClaim:
            claimName: voice-profiles-pvc

---
# Service para Frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: verbanota
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
