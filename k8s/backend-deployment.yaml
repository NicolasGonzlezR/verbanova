apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: translateapp
spec:
  # Single replica: model loading is stateful (singleton in-process).
  # Scale vertically (larger GPU node) rather than horizontally.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: YOUR_REGISTRY/translateapp-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DEVICE_PREFERENCE
              valueFrom:
                configMapKeyRef:
                  name: translateapp-config
                  key: DEVICE_PREFERENCE
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
          volumeMounts:
            - name: model-cache
              mountPath: /app/.cache
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "12Gi"
              cpu: "4"
              # Uncomment for GPU nodes with nvidia device plugin installed:
              # nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            # Backend loads models on first WebSocket connection, not on startup.
            # Readiness just checks the HTTP server is up.
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
      # GPU node affinity — uncomment when using CUDA nodes
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: nvidia.com/gpu
      #               operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: translateapp
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
