apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: translateapp-ingress
  namespace: translateapp
  annotations:
    # nginx ingress controller
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket upgrade support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Sticky sessions for WebSocket — all requests from the same client
    # land on the same backend pod (essential for long-lived WS connections)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "translateapp-backend"
    nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
    nginx.ingress.kubernetes.io/session-cookie-path: "/ws"
    # TLS — managed by cert-manager (optional, remove if terminating TLS elsewhere)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - YOUR_DOMAIN
  #     secretName: translateapp-tls
  rules:
    - host: YOUR_DOMAIN
      http:
        paths:
          # WebSocket backend — must come before the catch-all frontend rule
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Everything else goes to Next.js frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
