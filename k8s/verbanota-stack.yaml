---
apiVersion: v1
kind: Namespace
metadata:
  name: verbanota

---
# ConfigMap con variables de entorno no sensibles compartidas
apiVersion: v1
kind: ConfigMap
metadata:
  name: verbanota-config
  namespace: verbanota
data:
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "voice-profiles"
  BACKEND_HOST: "backend"
  BACKEND_PORT: "8000"
  FRONTEND_HOST: "frontend"
  FRONTEND_PORT: "3000"

---
# Secret con credenciales MinIO
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD → usadas por el contenedor MinIO
# MINIO_ACCESS_KEY / MINIO_SECRET_KEY   → usadas por backend (models.py) y frontend (s3.ts)
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: verbanota
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"

---
# Secret con credenciales de aplicación
# Cambiar JWT_SECRET y DATABASE_URL antes de desplegar en producción
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: verbanota
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  DATABASE_URL: "postgresql://verbanota:verbanota@postgres:5432/verbanota"

---
# PersistentVolumeClaim para cache de modelos ML (~10 GB)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-cache-pvc
  namespace: verbanota
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# Deployment para Backend (FastAPI WebSocket)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: verbanota
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: accelerator
                    operator: In
                    values:
                      - nvidia-gpu
      containers:
        - name: backend
          image: translateapp-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_ENDPOINT
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_BUCKET
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_SECRET_KEY
            - name: HF_HOME
              value: "/app/.cache"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              # nvidia.com/gpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
              # nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: backend-cache-pvc

---
# Service para Backend
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: verbanota
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
# Deployment para Frontend (Next.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: verbanota
  labels:
    app: frontend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
        - name: frontend
          image: translateapp-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Credenciales de base de datos y JWT (server-side)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: JWT_SECRET
            # MinIO server-side (s3.ts)
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_ENDPOINT
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: verbanota-config
                  key: MINIO_BUCKET
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_SECRET_KEY
            # NEXT_PUBLIC_* se inyectan en tiempo de build en el Dockerfile.
            # Estos valores solo funcionan en Server Components en runtime.
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://backend:8000/ws"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

---
# Service para Frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: verbanota
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
